    <!-- Google tag (gtag.js) -->

    <script>

      gtag('config', 'G-F3SGE82RSK');

    <!-- Medição só fora de desenvolvimento.
         O pixel não tinha condição nenhuma, então `npm run dev` em localhost
         alimentava o dataset de produção. Isso não é só ruído de volume: esses
         eventos entram no cálculo de qualidade da correspondência como se
         fossem visita real, e puxam a nota para baixo. Para testar de
         propósito, use "Eventos de teste" do Gerenciador de Eventos
         (META_TEST_EVENT_CODE) ou um dataset separado. -->
    <script>
      window.__manosVid = (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)manos_vid=([^;]*)/);
          if (m) return decodeURIComponent(m[1]);
          var id = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : "v_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 11);
          document.cookie = "manos_vid=" + encodeURIComponent(id) +
            ";Max-Age=63072000;Path=/;SameSite=Lax" +
            (location.protocol === "https:" ? ";Secure" : "");
          return id;
        } catch (e) { return ""; }
      })();
      // Id do dataset da Meta. Vem de VITE_META_PIXEL_ID e o Vite o substitui no
      // build; sem a variável, sobra o marcador com "%" e caímos no dataset de
      // produção. Mesmo padrão do pixel do OpenAI Ads, logo abaixo.
      //
      // O par desta variável é META_PIXEL_ID, lida em tempo de execução pelo
      // servidor (Conversions API e páginas SSR do catálogo). As duas recebem o
      // MESMO id: trocar só uma coloca funil e catálogo em datasets diferentes.
      window.__manosPixelId = (function () {
        var id = "%VITE_META_PIXEL_ID%";
        // Sem a variável, o marcador sobra literal e começa com "%"; definida e
        // vazia, o Vite substitui por string vazia. Os dois casos caem no
        // padrão — melhor o dataset de produção do que pixel com id em branco.
        return !id || id.charAt(0) === "%" ? "3253946971444443" : id;
      })();
      window.__medirEmProducao =
        !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !/\.local$/.test(location.hostname);
    </script>
    <!-- Meta Pixel Code -->
    <script>
    if (window.__medirEmProducao) {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    // external_id no init: vale para TODOS os eventos seguintes, inclusive o
    // PageView logo abaixo. É o sinal que sobrevive à troca de dispositivo e
    // chega até o Purchase, semanas depois, vindo do CRM.
    fbq('init', window.__manosPixelId, window.__manosVid ? { external_id: window.__manosVid } : {});
    fbq('track', 'PageView');
    }
    </script>
    <!-- End Meta Pixel Code -->
    <!-- OpenAI Ads Pixel (anúncios dentro do ChatGPT).
         O ID vem de VITE_OPENAI_ADS_PIXEL_ID e o Vite o substitui no build. Se
         a variável não existir, o marcador sobra na string e o `if` abaixo
         impede o init — melhor não medir do que mandar evento para pixel
         errado. debug fica false: com true o SDK escreve no console de quem
         está navegando; ligue só para conferir no Pixel Helper. -->
    <script>
      (function (w, d, s, u, id) {
        if (!id || id.charAt(0) === "%") return;
        if (!w.__medirEmProducao) return;
        if (!w.oaiq) {
          var q = function () { q.q.push(arguments) };
          q.q = []; w.oaiq = q;
          var j = d.createElement(s); j.async = 1; j.src = u;
          var f = d.getElementsByTagName(s)[0];
          f.parentNode.insertBefore(j, f);
        }
        w.oaiq("init", { pixelId: id, debug: false });
      })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js", "%VITE_OPENAI_ADS_PIXEL_ID%");
    </script>
    <!-- End OpenAI Ads Pixel -->
  </head>
  <body>

    <!-- Este <noscript> NÃO acompanha VITE_META_PIXEL_ID: sem JS não há como

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=3253946971444443&ev=PageView&noscript=1"
    /></noscript>
    <!--

      bundle não carregar (rede de celular ruim, JS bloqueado, erro de deploy), a

      de texto. O React substitui tudo isto ao montar, então o visitante só vê
      este bloco quando é a única coisa que existe.
    -->
    <div id="root">
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;background:#FDF8F1;color:#3B2016;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <img src="https://manosveiculos.com.br/wp-content/uploads/2024/02/LogoManos.png" alt="Manos Veículos" style="height:40px;width:auto;object-fit:contain" />
        <h1 style="font-size:22px;font-weight:800;line-height:1.1;margin:0;font-family:'Bitter',Georgia,serif">Manos Veículos</h1>

          Compra, venda, troca e financiamento de seminovos em Rio do Sul/SC.

        </p>
        <a href="tel:+554733001352" style="padding:16px 28px;width:100%;max-width:340px;background:#7A2E1E;color:#FDF3E7;font-weight:800;font-size:15px;text-transform:uppercase;border-radius:16px;text-decoration:none;text-align:center">Ligar: (47) 3300-1352</a>
        <a href="https://wa.me/554733001352" style="padding:16px 28px;width:100%;max-width:340px;background:#22c55e;color:#fff;font-weight:800;font-size:15px;text-transform:uppercase;border-radius:16px;text-decoration:none;text-align:center">Falar no WhatsApp</a>
        <a href="/estoque" style="padding:14px 28px;width:100%;max-width:340px;background:#F4E6D7;border:1px solid #EEDFCF;color:#7A2E1E;font-weight:700;font-size:14px;text-transform:uppercase;border-radius:16px;text-decoration:none;text-align:center">Ver estoque</a>
        <p style="font-size:12px;color:#A88A70;max-width:340px;line-height:1.5;margin:0">
          R. Dom Pedro II, 374 &ndash; Canoas, Rio do Sul/SC &bull; Seg a Sex 8h&ndash;19h &bull; Sáb 8h&ndash;13h
        </p>
      </div>
    </div>
